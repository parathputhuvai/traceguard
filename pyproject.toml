[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "traceguard"
version = "0.1.0"
description = "Controlled MCP tools for local Linux authentication-log investigation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9,<2",
    "regex>=2024.11.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
traceguard = "traceguard.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

